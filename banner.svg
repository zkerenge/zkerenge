<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2a;stop-opacity:1">
        <animate attributeName="stop-color" values="#0a0a2a;#0a2a2a;#0a0a2a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0a2a2a;stop-opacity:1">
        <animate attributeName="stop-color" values="#0a2a2a;#0a0a2a;#0a2a2a" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="djangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#092E20"/>
      <stop offset="100%" style="stop-color:#0F4C3A"/>
    </linearGradient>

    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6F00"/>
      <stop offset="100%" style="stop-color:#FFA000"/>
    </linearGradient>

    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4"/>
      <stop offset="100%" style="stop-color:#4DD0E1"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline filter -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" fill="url(#scanlines)"/>

  <!-- Floating particles / code rain -->
  <g opacity="0.15">
    <text x="50" y="50" fill="#00FF88" font-size="12" font-family="monospace">
      &lt;/&gt;
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="80" fill="#00FF88" font-size="10" font-family="monospace">
      {}
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    </text>
    <text x="250" y="40" fill="#00FF88" font-size="11" font-family="monospace">
      [];
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite" begin="2s"/>
    </text>
    <text x="800" y="60" fill="#00BCD4" font-size="10" font-family="monospace">
      0x7F
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
    </text>
    <text x="900" y="100" fill="#00BCD4" font-size="11" font-family="monospace">
      &lt;secure/&gt;
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite" begin="1.5s"/>
    </text>
  </g>

  <!-- ===== PILLAR 1: SOFTWARE DEV (LEFT) ===== -->
  <g transform="translate(80, 100)">
    <!-- Django Logo -->
    <g filter="url(#glow)">
      <rect x="-20" y="-25" width="40" height="50" rx="8" fill="url(#djangoGrad)" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Arial">D</text>
    </g>

    <!-- Code brackets animation -->
    <text x="0" y="40" text-anchor="middle" fill="#44FFAA" font-size="11" font-family="monospace">
      &lt;code/&gt;
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </text>

    <!-- Pillar label -->
    <text x="0" y="65" text-anchor="middle" fill="#FFFFFF" font-size="10" font-family="Arial" opacity="0.7">Software</text>
    <text x="0" y="78" text-anchor="middle" fill="#44FFAA" font-size="10" font-family="Arial" font-weight="bold">Developer</text>
  </g>

  <!-- ===== PILLAR 2: DATA SCIENCE (CENTER) ===== -->
  <g transform="translate(500, 85)">
    <!-- Animated bar chart -->
    <g>
      <!-- Bar 1 -->
      <rect x="-60" y="30" width="20" height="30" fill="url(#dataGrad)" rx="2" opacity="0.8">
        <animate attributeName="height" values="20;40;20" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="40;20;40" dur="2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 2 -->
      <rect x="-30" y="15" width="20" height="45" fill="url(#dataGrad)" rx="2" opacity="0.9">
        <animate attributeName="height" values="35;50;35" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="25;10;25" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 3 -->
      <rect x="0" y="5" width="20" height="55" fill="url(#dataGrad)" rx="2" opacity="1">
        <animate attributeName="height" values="50;60;50" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;0;10" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 4 -->
      <rect x="30" y="20" width="20" height="40" fill="url(#dataGrad)" rx="2" opacity="0.8">
        <animate attributeName="height" values="30;45;30" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;15;30" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 5 -->
      <rect x="60" y="10" width="20" height="50" fill="url(#dataGrad)" rx="2" opacity="0.7">
        <animate attributeName="height" values="45;55;45" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="15;5;15" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Upward trend line -->
    <polyline points="-70,50 -40,35 -10,20 20,10 50,0 80,-10" fill="none" stroke="#FF6F00" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </polyline>

    <!-- Pillar label -->
    <text x="0" y="85" text-anchor="middle" fill="#FFFFFF" font-size="10" font-family="Arial" opacity="0.7">Data</text>
    <text x="0" y="98" text-anchor="middle" fill="#FFA000" font-size="10" font-family="Arial" font-weight="bold">Scientist</text>
  </g>

  <!-- ===== PILLAR 3: CYBERSECURITY (RIGHT) ===== -->
  <g transform="translate(920, 95)">
    <!-- Lock body -->
    <g filter="url(#glow)">
      <rect x="-18" y="-10" width="36" height="30" rx="5" fill="none" stroke="#00BCD4" stroke-width="2.5" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </rect>
      <!-- Lock shackle -->
      <path d="M-10,-10 L-10,-18 Q-10,-28 0,-28 Q10,-28 10,-18 L10,-10" fill="none" stroke="#00BCD4" stroke-width="2.5"/>
      <!-- Lock keyhole -->
      <circle cx="0" cy="5" r="3" fill="#00BCD4" opacity="0.8"/>
      <rect x="-1.5" y="5" width="3" height="8" fill="#00BCD4" rx="1"/>
    </g>

    <!-- Scanning ring animation -->
    <circle cx="0" cy="5" r="30" fill="none" stroke="#4DD0E1" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="20;40;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Pillar label -->
    <text x="0" y="55" text-anchor="middle" fill="#FFFFFF" font-size="10" font-family="Arial" opacity="0.7">Cyber</text>
    <text x="0" y="68" text-anchor="middle" fill="#4DD0E1" font-size="10" font-family="Arial" font-weight="bold">Security</text>
  </g>

  <!-- ===== CENTER PIECE: DJANGO MASTERY ===== -->
  <g transform="translate(500, 170)">
    <!-- Django badge -->
    <rect x="-80" y="-20" width="160" height="40" rx="20" fill="url(#djangoGrad)" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="Arial">
      Django Expert
    </text>
  </g>

  <!-- ===== TYPING NAME ANIMATION ===== -->
  <g transform="translate(500, 235)">
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="bold" font-family="monospace">
      zkerenge
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <!-- Cursor blink -->
    <rect x="115" y="-20" width="3" height="28" fill="#44FFAA">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== SUBTITLE ===== -->
  <g transform="translate(500, 265)">
    <text x="0" y="0" text-anchor="middle" fill="#888888" font-size="12" font-family="monospace">
      Building secure, data-driven web apps
    </text>
  </g>

  <!-- ===== DECORATIVE DIVIDER LINES ===== -->
  <g opacity="0.15">
    <line x1="200" y1="50" x2="200" y2="250" stroke="#44FFAA" stroke-width="0.5" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;8;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="800" y1="50" x2="800" y2="250" stroke="#00BCD4" stroke-width="0.5" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;8;0" dur="2s" repeatCount="indefinite" begin="1s"/>
    </line>
  </g>

  <!-- Corner brackets -->
  <g opacity="0.2" stroke="#44FFAA" stroke-width="2" fill="none">
    <path d="M10,20 L10,10 L20,10"/>
    <path d="M990,20 L990,10 L980,10"/>
    <path d="M10,290 L10,280 L20,280"/>
    <path d="M990,290 L990,280 L980,280"/>
  </g>
</svg>
